services:
  # Новый сервис Nginx
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "8082:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile.python
    # Убрали ports: "8082:8080"! Теперь Python не виден извне
    expose:
      - "8080"     # Порт виден только внутри Docker-сети
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: myuser
      POSTGRES_DB: mydatabase

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: myuser
      POSTGRES_DB: mydatabase
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
